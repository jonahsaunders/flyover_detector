project:
  title: "Flyover Audio Filter"
  author: "Jonah Saunders"
  description: "I2S audio filter that detects and attenuates falling tones and their harmonics"
  language: "Verilog"
  clock_hz: 24576000
  tiles: "2x2"
  top_module: "tt_um_jonahsaunders_flyover_detector"
  source_files:
    - "tt_um_jonahsaunders_flyover_detector.v"
    - "glide_detector.v"
    - "harmonic_notch.v"

